name: lab3

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: lab3-rustfs
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_VOLUMES: /data/disk{1...4}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - ./disks/disk1:/data/disk1
      - ./disks/disk2:/data/disk2
      - ./disks/disk3:/data/disk3
      - ./disks/disk4:/data/disk4
    restart: "no"
